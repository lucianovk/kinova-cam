# Gerado por scripts/ros_export.py (kinova-cam). Valores do CAD, sem calibração.
# end_effector_link: ros2_kortex (Gen3 6DOF), no eixo da junta 6, 2.87 mm atrás da face do aro Ø75.
# camera_link: realsense-ros, imageador esquerdo no plano de profundidade zero
# (x frente, y esquerda, z cima). rpy em rad (eixos fixos x, y, z); quat x y z w.
# Montagem: câmera do lado +Y do end_effector_link (oposto ao deslocamento dos
# botões de admitância), orelhas do anel alinhadas com os botões, câmera de pé.

ring:
  description: "D435i centrada no punho, 15° (versão original)"
  camera: D435i
  parent_frame: end_effector_link
  child_frame: camera_link
  xyz: [0.0175, 0.053661, 0.005196]
  rpy: [0, -1.309, -1.5708]
  quat_xyzw: [0.430459, 0.430459, 0.560986, -0.560986]
  depth_profile: "424x240 (Z mín ~105 mm)"
  mount_mass_kg_pla: 0.092  # anel impresso (estimativa, sem câmera nem parafusos)
  mount_com_in_ee_m: [0.0000, 0.0280, -0.0308]

